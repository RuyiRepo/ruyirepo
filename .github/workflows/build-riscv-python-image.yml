# .github/workflows/build-python-images.yml
name: Build RISC-V Python Images

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to build'
        required: true
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Python ${{ github.event.inputs.python_version }} image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/riscv64
          push: true
          tags: |
            ghcr.io/ruyirepo/riscv-python-${{ github.event.inputs.python_version }}:latest
            ghcr.io/ruyirepo/riscv-python-${{ github.event.inputs.python_version }}:${{ github.run_number }}
          file: docker/Dockerfile.riscv-python-${{ github.event.inputs.python_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
