# .github/workflows/build-python-images.yml
name: Build RISC-V Python Images

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to build'
        required: true
        default: 'all'
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: 
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
      fail-fast: false

    if: |
      github.event.inputs.python_version == 'all' || 
      github.event.inputs.python_version == matrix.python-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Python ${{ matrix.python-version }} image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/riscv64
          push: true
          tags: |
            ghcr.io/ruyirepo/riscv-python-${{ matrix.python-version }}:latest
            ghcr.io/ruyirepo/riscv-python-${{ matrix.python-version }}:${{ github.run_number }}
          file: docker/Dockerfile.riscv-python-${{ matrix.python-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
