# .github/workflows/build-riscv-python-image.yml
name: Build RISC-V Python Multi-Version Image

on:
  workflow_dispatch:  # 手动触发，或设置 schedule

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RISC-V Python image
        uses: docker/build-push-action@v5
        with:
          platforms: linux/riscv64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/riscv-python:latest
            ghcr.io/${{ github.repository_owner }}/riscv-python:3.10-14
          file: Dockerfile.riscv-python
