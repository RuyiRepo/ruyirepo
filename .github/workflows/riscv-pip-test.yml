# .github/workflows/riscv-pip-test.yml
name: RISC-V PyPI Connectivity Test

on:
  schedule:
    # 每小时执行一次
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  test-pip-install:
    runs-on: ubuntu-latest

    # 设置矩阵策略，测试多个 Python 版本
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      # 可选：即使某个版本失败，其他版本继续测试
      fail-fast: false

    steps:
      - name: Cache Python compilation
        id: cache-python
        uses: actions/cache@v4
        with:
          # 缓存编译后的 Python 安装目录和源码目录
          path: |
            /tmp/python-build/${{ matrix.python-version }}
            /usr/local/python${{ matrix.python-version }}
          # 缓存键：Python 版本 + 编译器版本 + 优化标志
          key: riscv-python-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('scripts/python-build-${{ matrix.python-version }}.sh') }}
          restore-keys: |
            riscv-python-${{ matrix.python-version }}-${{ runner.os }}-
            riscv-python-${{ matrix.python-version }}-

      - name: Run pip install test in RISC-V container
<<<<<<< HEAD
        id: pip_test_${{ matrix.python-version }}
=======
        id: pip_test
>>>>>>> d1df719aa44ec80cd1cb6094a7c3c8011f4ab1f5
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: riscv64
          distro: ubuntu24.04  # glibc 2.39 > 2.38 ✓
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume /tmp/python-build/${{ matrix.python-version }}:/tmp/python-build
            --volume /usr/local/python${{ matrix.python-version }}:/usr/local/python${{ matrix.python-version }}

          run: |
            # 设置编译标志和路径
            PYTHON_VERSION="${{ matrix.python-version }}"
            BUILD_DIR="/tmp/python-build/${PYTHON_VERSION}"
            INSTALL_DIR="/usr/local/python${PYTHON_VERSION}"

            # 创建必要的目录
            mkdir -p $BUILD_DIR $INSTALL_DIR

            # 检查缓存中是否已有编译好的 Python
            if [ -f "$INSTALL_DIR/bin/python3" ] && [ -x "$INSTALL_DIR/bin/python3" ]; then
                echo "✓ 从缓存恢复 Python ${PYTHON_VERSION}"
                export PATH=$INSTALL_DIR/bin:$PATH

                # 验证 Python 版本
                INSTALLED_VERSION=$(python3 --version 2>&1 | awk '{print $2}')
                if [[ "$INSTALLED_VERSION" == "$PYTHON_VERSION"* ]]; then
                    echo "✓ 缓存版本验证通过: $INSTALLED_VERSION"
                    USE_CACHED=true
                else
                    echo "⚠️ 缓存版本不匹配，重新编译"
                    USE_CACHED=false
                    rm -rf $INSTALL_DIR/*
                fi
            else
                echo "未找到缓存，将进行完整编译"
                USE_CACHED=false
            fi

            set -e
            echo "=========================================="
            echo "Python 版本: ${{ matrix.python-version }}"
            echo "=========================================="

            # 显示系统信息
            echo "========== 系统信息 =========="
            uname -m
            cat /etc/os-release | head -n 3
            echo "==============================="

            # 检查 glibc 版本 (需要 >= 2.38)
            echo "========== glibc 版本检查 =========="
            GLIBC_VERSION=$(ldd --version | head -n1 | grep -oP '\d+\.\d+$' || echo "0.0")
            echo "检测到的 glibc 版本: $GLIBC_VERSION"

            # 比较版本号 (使用 awk 进行数值比较)
            REQUIRED_VERSION="2.38"
            if [ "$(printf '%s\n' "$REQUIRED_VERSION" "$GLIBC_VERSION" | sort -V | head -n1)" != "$REQUIRED_VERSION" ]; then
                echo "❌ 错误: glibc 版本 $GLIBC_VERSION < 要求的 $REQUIRED_VERSION"
                exit 1
            fi
            echo "✓ glibc 版本 $GLIBC_VERSION >= $REQUIRED_VERSION (通过)"
            echo "====================================="

            # 只在没有缓存时安装依赖和编译
            if [ "$USE_CACHED" != "true" ]; then
                echo "========== 安装编译依赖 =========="
                apt-get update -qq
                apt-get install -y -qq \
                    build-essential \
                    libssl-dev \
                    libffi-dev \
                    zlib1g-dev \
                    libbz2-dev \
                    libreadline-dev \
                    libsqlite3-dev \
                    libncurses5-dev \
                    libgdbm-dev \
                    libdb-dev \
                    libexpat1-dev \
                    liblzma-dev \
                    tk-dev \
                    uuid-dev \
                    wget \
                    gcc \
                    make \
                    curl \
                    xz-utils \
                    git
                echo "==================================="

                # 下载 Python 源码
                echo "========== 下载 Python 源码 =========="
                cd $BUILD_DIR

                # 智能选择源码 URL
                if [ "$PYTHON_VERSION" = "3.14" ]; then
                    # Python 3.14 开发版本
                    PYTHON_BASE="3.14.0"
                    PYTHON_PATCH="a4"
                    PYTHON_FULL="${PYTHON_BASE}a${PYTHON_PATCH}"

                    # 尝试多个源
                    if ! wget -q --timeout=30 "https://www.python.org/ftp/python/${PYTHON_FULL}/Python-${PYTHON_FULL}.tar.xz" -O Python-${PYTHON_FULL}.tar.xz; then
                        echo "从 GitHub 下载 Python 3.14 源码"
                        git clone --depth 1 --branch main https://github.com/python/cpython.git cpython-3.14
                        cd cpython-3.14
                        BUILD_READY=true
                    else
                        tar -xf Python-${PYTHON_FULL}.tar.xz
                        cd Python-${PYTHON_FULL}
                        BUILD_READY=true
                    fi
                else
                    # 正式版本
                    PYTHON_FULL="${PYTHON_VERSION}.0"
                    wget -q --timeout=30 "https://www.python.org/ftp/python/${PYTHON_FULL}/Python-${PYTHON_FULL}.tar.xz" -O Python-${PYTHON_FULL}.tar.xz
                    tar -xf Python-${PYTHON_FULL}.tar.xz
                    cd Python-${PYTHON_FULL}
                    BUILD_READY=true
                fi

                if [ "$BUILD_READY" != "true" ]; then
                    echo "❌ 无法下载 Python 源码"
                    exit 1
                fi
                echo "✓ Python 源码准备完成"
                echo "========================================="

                # 配置和编译 Python (使用优化选项)
                echo "========== 配置 Python 编译选项 =========="
                # 使用 --enable-optimizations 会进行 PGO 优化，但编译时间更长
                # 这里使用较快的优化选项
                ./configure \
                    --prefix=$INSTALL_DIR \
                    --enable-optimizations \
                    --with-lto \
                    --enable-loadable-sqlite-extensions \
                    --enable-ipv6 \
                    --enable-shared \
                    LDFLAGS="-Wl,-rpath,$INSTALL_DIR/lib" \
                    > configure.log 2>&1

                echo "========== 编译 Python =========="
                # 使用所有可用的 CPU 核心并行编译
                echo "使用 $(nproc) 个 CPU 核心进行编译..."
                make -j$(nproc) > make.log 2>&1

                echo "========== 安装 Python =========="
                make install > install.log 2>&1

                echo "✓ Python 编译完成"
                echo "=================================="
            else
                echo "✓ 使用缓存的 Python 编译版本"
            fi

            # 设置环境变量
            export PATH=$INSTALL_DIR/bin:$PATH
            export LD_LIBRARY_PATH=$INSTALL_DIR/lib:$LD_LIBRARY_PATH

            # 验证安装
            echo "========== Python 版本验证 =========="
            python3 --version
            echo "======================================"

            # 升级 pip 到所需版本
            echo "========== 升级 pip 到 >= 26.0.1 =========="
            python3 -m ensurepip --upgrade
            python3 -m pip install --upgrade pip  --no-cache-dir

            # 检查 pip 版本
            PIP_VERSION=$(python3 -m pip --version | awk '{print $2}')
            echo "当前 pip 版本: $PIP_VERSION"

            # 比较 pip 版本 (需要 >= 26.0.1)
            REQUIRED_PIP="26.0.1"
            if [ "$(printf '%s\n' "$REQUIRED_PIP" "$PIP_VERSION" | sort -V | head -n1)" != "$REQUIRED_PIP" ]; then
                echo "❌ 错误: pip 版本 $PIP_VERSION < 要求的 $REQUIRED_PIP"
                exit 1
            fi
            echo "✓ pip 版本 $PIP_VERSION >= $REQUIRED_PIP (通过)"
            echo "============================================="

            # 可选：缓存 pip 包
            echo "========== 配置 pip 缓存 =========="
            mkdir -p /tmp/pip-cache
            python3 -m pip config set global.cache-dir /tmp/pip-cache

            # 测试 PyPI 连通性
            echo "========== 测试 PyPI 连通性 =========="

            # 创建虚拟环境
            python3 -m venv /tmp/test_venv_${{ matrix.python-version }}
            source /tmp/test_venv_${{ matrix.python-version }}/bin/activate

            # 测试包列表 (可修改)
            PACKAGES="numpy==2.2.4 torch==2.10.0 psutil==5.9.3"

            FAILED_PACKAGES=""
            SUCCESS_COUNT=0
            FAIL_COUNT=0

            for pkg in $PACKAGES; do
                echo "测试安装: $pkg"
                START_TIME=$(date +%s)

                if pip install -i https://ruyirepo.ruyicommunity.cn/pypi/simple/ "$pkg" --timeout 30 --no-cache-dir; then
                    END_TIME=$(date +%s)
                    DURATION=$((END_TIME - START_TIME))
                    echo "✓ $pkg 安装成功 (耗时: ${DURATION}s)"
                    SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                else
                    echo "❌ $pkg 安装失败"
                    FAILED_PACKAGES="$FAILED_PACKAGES $pkg"
                    FAIL_COUNT=$((FAIL_COUNT + 1))
                fi
                echo "---"
            done

            deactivate

            # 如果有失败的包，退出并报错
            if [ -n "$FAILED_PACKAGES" ]; then
                echo "=========================================="
                echo "❌ 失败的包:$FAILED_PACKAGES"
                echo "=========================================="
                exit 1
            fi

            echo "========== 所有测试通过 =========="
            echo "✓ Python ${{ matrix.python-version }} 测试成功"

      # 保存编译日志（用于调试）
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-python-${{ matrix.python-version }}
          path: |
            /tmp/python-build/${{ matrix.python-version }}/*.log
          retention-days: 7

      # 如果任意一个 Python 版本测试失败，发送邮件
      - name: Send failure email
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: |
            ⚠️ [GitHub Actions] RISC-V PyPI 连通性测试失败 - Python ${{ matrix.python-version }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            📅 时间: ${{ github.run_started_at }}
            🔗 Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            💻 架构: RISC-V (QEMU 模拟) - Ubuntu 24.04 (glibc 2.39)
            🐍 Python 版本: ${{ matrix.python-version }}
            📦 测试包: numpy, requests, pytest

            ⚙️ 环境要求检查结果:
            - glibc >= 2.38: ✓ 通过 (实际版本 2.39)
            - pip >= 26.0.1: ⚠️ 失败时版本可能低于要求

            🔄 缓存状态: ${{ steps.cache-python.outputs.cache-hit == 'true' && '使用缓存 ✓' || '首次编译' }}

            错误详情请查看完整日志:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            此邮件由 GitHub Actions 自动发送

      # 生成测试摘要
      - name: Generate summary
        if: always()
        run: |
          echo "## RISC-V PyPI 测试报告 - Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 信息 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 执行时间 | ${{ github.run_started_at }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 状态 | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python 版本 | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| glibc 版本 | 2.39 (✓ 满足 ≥2.38) |" >> $GITHUB_STEP_SUMMARY
          echo "| 缓存使用 | ${{ steps.cache-python.outputs.cache-hit == 'true' && '✓ 命中' || '首次构建' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 所有测试通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 测试失败，请查看上方日志" >> $GITHUB_STEP_SUMMARY
          fi

