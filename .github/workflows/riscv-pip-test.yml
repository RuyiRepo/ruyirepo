# .github/workflows/riscv-pip-test.yml
name: RISC-V PyPI Connectivity Test

on:
  schedule:
    # 每小时执行一次
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  test-pip-install:
    runs-on: ubuntu-latest

    # 设置矩阵策略，测试多个 Python 版本
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      # 可选：即使某个版本失败，其他版本继续测试
      fail-fast: false

    steps:
      - name: Convert owner to lowercase
        id: vars
        run: |
          echo "owner_lowercase=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Run pip install test in RISC-V container
        id: pip_test
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: riscv64
          dockerImage: ghcr.io/${{ steps.vars.outputs.owner_lowercase }}/riscv-python-${{ matrix.python-version }}:latest
          githubToken: ${{ github.token }}

          run: |
            set -e

            echo "=========================================="
            echo "Python 版本: ${{ matrix.python-version }}"
            echo "=========================================="

            # 显示版本信息
            python3 --version
            pip3 --version

            # 显示系统信息
            echo "========== 系统信息 =========="
            uname -m
            cat /etc/os-release | head -n 3
            echo "==============================="

            # 检查 glibc 版本 (需要 >= 2.38)
            echo "========== glibc 版本检查 =========="
            GLIBC_VERSION=$(ldd --version | head -n1 | grep -oP '\d+\.\d+$' || echo "0.0")
            echo "检测到的 glibc 版本: $GLIBC_VERSION"

            # 比较版本号 (使用 awk 进行数值比较)
            REQUIRED_VERSION="2.38"
            if [ "$(printf '%s\n' "$REQUIRED_VERSION" "$GLIBC_VERSION" | sort -V | head -n1)" != "$REQUIRED_VERSION" ]; then
                echo "❌ 错误: glibc 版本 $GLIBC_VERSION < 要求的 $REQUIRED_VERSION"
                exit 1
            fi
            echo "✓ glibc 版本 $GLIBC_VERSION >= $REQUIRED_VERSION (通过)"
            echo "====================================="

            # 升级 pip 到所需版本
            echo "========== 升级 pip 到 >= 26.0.1 =========="
            pip3 install --upgrade pip

            # 检查 pip 版本
            PIP_VERSION=$(pip3 --version | awk '{print $2}')
            echo "当前 pip 版本: $PIP_VERSION"

            # 比较 pip 版本 (需要 >= 26.0.1)
            REQUIRED_PIP="26.0.1"
            if [ "$(printf '%s\n' "$REQUIRED_PIP" "$PIP_VERSION" | sort -V | head -n1)" != "$REQUIRED_PIP" ]; then
                echo "❌ 错误: pip 版本 $PIP_VERSION < 要求的 $REQUIRED_PIP"
                exit 1
            fi
            echo "✓ pip 版本 $PIP_VERSION >= $REQUIRED_PIP (通过)"
            echo "============================================="

            # 测试 PyPI 连通性
            echo "========== 测试 PyPI 连通性 =========="

            # 创建虚拟环境
            python -m venv /tmp/test_venv_${{ matrix.python-version }}
            source /tmp/test_venv_${{ matrix.python-version }}/bin/activate

            # 测试包列表 (可修改)
            PACKAGES="numpy==2.2.4 torch==2.10.0 psutil==5.9.3"

            FAILED_PACKAGES=""
            SUCCESS_COUNT=0
            FAIL_COUNT=0

            for pkg in $PACKAGES; do
                echo "测试安装: $pkg"
                START_TIME=$(date +%s)

                if pip install -i https://ruyirepo.ruyicommunity.cn/pypi/simple/ "$pkg" --timeout 30 --no-cache-dir; then
                    END_TIME=$(date +%s)
                    DURATION=$((END_TIME - START_TIME))
                    echo "✓ $pkg 安装成功 (耗时: ${DURATION}s)"
                    SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                else
                    echo "❌ $pkg 安装失败"
                    FAILED_PACKAGES="$FAILED_PACKAGES $pkg"
                    FAIL_COUNT=$((FAIL_COUNT + 1))
                fi
                echo "---"
            done

            deactivate

            # 如果有失败的包，退出并报错
            if [ -n "$FAILED_PACKAGES" ]; then
                echo "=========================================="
                echo "❌ 失败的包:$FAILED_PACKAGES"
                echo "=========================================="
                exit 1
            fi

            echo "========== 所有测试通过 =========="
            echo "✓ Python ${{ matrix.python-version }} 测试成功"

      # 保存编译日志（用于调试）
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-python-${{ matrix.python-version }}
          path: |
            /tmp/python-build/${{ matrix.python-version }}/*.log
          retention-days: 7

      # 如果任意一个 Python 版本测试失败，发送邮件
      - name: Send failure email
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: |
            ⚠️ [GitHub Actions] RISC-V PyPI 连通性测试失败 - Python ${{ matrix.python-version }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            📅 时间: ${{ github.run_started_at }}
            🔗 Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            💻 架构: RISC-V (QEMU 模拟) - Ubuntu 24.04 (glibc 2.39)
            🐍 Python 版本: ${{ matrix.python-version }}
            📦 测试包: numpy==2.2.4, torch==2.10.0, psutil==5.9.3

            ⚙️ 环境要求检查结果:
            - glibc >= 2.38: ✓ 通过 (实际版本 2.39)
            - pip >= 26.0.1: ⚠️ 失败时版本可能低于要求

            错误详情请查看完整日志:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            此邮件由 GitHub Actions 自动发送

      # 生成测试摘要
      - name: Generate summary
        if: always()
        run: |
          echo "## RISC-V PyPI 测试报告 - Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 信息 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 执行时间 | ${{ github.run_started_at }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 状态 | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python 版本 | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| glibc 版本 | 2.39 (✓ 满足 ≥2.38) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 所有测试通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 测试失败，请查看上方日志" >> $GITHUB_STEP_SUMMARY
          fi

